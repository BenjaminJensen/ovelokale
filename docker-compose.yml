services:
  web:
    build:
      context: ./docker/php
    ports:
      - "${PHP_PORT}:80"
    volumes:
      - ./backend:/var/www/html
    environment:
      DB_HOST: db
      DB_DATABASE: ${DB_DATABASE}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
    depends_on:
      - db
      - mailhog

  frontend:
    image: node:20-alpine
    working_dir: /app
    # Installs @playwright/test so `npm run typecheck` and `npm run lint` cover
    # the e2e specs, but never runs them: this image is musl and Playwright
    # publishes no musl browser builds. The browsers live in the `playwright`
    # service below.
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "${VITE_PORT}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - web

  # Browser-driven frontend verification. Not part of `docker compose up` (see
  # `profiles`) — it has no long-running process and is invoked per run by
  # scripts/e2e.sh. Its image tag MUST match the @playwright/test version in
  # frontend/package.json exactly, or Playwright refuses to launch.
  playwright:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    profiles: ["e2e"]
    working_dir: /app
    init: true
    # Chromium needs a larger /dev/shm than Docker's 64MB default.
    ipc: host
    command: ["npx", "playwright", "test"]
    environment:
      E2E_BASE_URL: http://frontend:5173
      E2E_API_URL: http://web:80
    ports:
      # Only published with `docker compose run --service-ports`, for `show-report`.
      - "${PLAYWRIGHT_REPORT_PORT}:9323"
    volumes:
      - ./frontend:/app
      # Separate from frontend_node_modules: that volume holds musl builds of
      # esbuild/rollup, which this glibc image cannot execute.
      - playwright_node_modules:/app/node_modules
    depends_on:
      - frontend
      - web

  db:
    image: mysql:8.0
    ports:
      - "${MYSQL_PORT}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d

  phpmyadmin:
    image: phpmyadmin
    ports:
      - "${PHPMYADMIN_PORT}:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

  mailhog:
    image: mailhog/mailhog
    ports:
      - "${MAILHOG_UI_PORT}:8025"
      - "${MAILHOG_SMTP_PORT}:1025"

volumes:
  db_data:
  frontend_node_modules:
  playwright_node_modules:
